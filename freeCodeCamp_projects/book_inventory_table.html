<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Book Inventory</title>
  <link rel="stylesheet" href="book_inventory_table.css">
</head>

<body>
  <main>
    <h1>Book Inventory</h1>
    <table>
      <thead>
        <tr class="table-header">
          <th>Title</th>
          <th>Author</th>
          <th>Category</th>
          <th>Status</th>
          <th>Rate</th>
        </tr>
      </thead>
      <tbody>
        <tr class="read">
          <td class="title">The Fellowship of the Ring</td>
          <td class="author">J.R.R. Tolkein</td>
          <td class="category">Fantasy</td>
          <td><span class="status">Read</span></td>
          <td>
            <span class="rate three">
              <span></span>
              <span></span>
              <span></span>
            </span>
          </td>
        </tr>
        <tr class="in-progress">
          <td class="title">The Two Towers</td>
          <td class="author">J.R.R. Tolkein</td>
          <td class="category">Fantasy</td>
          <td><span class="status">In Progress</span></td>
          <td>
            <span class="rate two">
              <span></span>
              <span></span>
              <span></span>
            </span>
          </td>
        </tr>
        <tr class="to-read">
          <td class="title">The Return of the King</td>
          <td class="author">J.R.R. Tolkein</td>
          <td class="category">Fantasy</td>
          <td><span class="status">To Read</span></td>
          <td>
            <span class="rate one">
              <span></span>
              <span></span>
              <span></span>
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </main>

</body>

</html>
